[package]
name = "gearbox"
version = "0.1.0"
edition = "2024"

[features]
auto-egui = []
dbg-schedules = ["auto-egui"]
# An egui editor for viewing and editing reflected components
editor = []
# Skinned mesh loading (glTF/FBX), animation and rendering (`gearbox::skeletal`)
skeletal = ["shaders/skeletal", "dep:gltf", "dep:base64", "dep:ufbx"]
# Rapier 3D physics (`gearbox::rapier`)
rapier = ["dep:rapier3d", "dep:bimap", "dep:dashmap", "dep:chrono"]

[dependencies]
anarchy = { path = "../anarchy", features = ["glam"] }
magician-vgpu = { path = "../shader_magician/magician-vgpu" }
mutual = "1.0.2"
anyhow = "1"
getset = "0.1.7"
log = "0.4"
shaders = { path = "./shaders" }

winit = { version = "0.30", features = ["android-native-activity"] }
ahash = { version = "0.8.12", default-features = false, features = ["std", "compile-time-rng"] }
derive_more = "2.1.1"
tobj = "3.2"
web-time = "1.1.0"

# ui
serde = { version = "1.0.219", features = ["derive"] }
ordered-float = { version = "5.3.0", features = ["bytemuck"] }
bytemuck = { version = "1.25.1", features = ["derive"] }
ttf-parser = "0.25.1"
taffy = "0.14.0"

# skeletal
gltf = { version = "1.4.1", optional = true }
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.44", optional = true }

# rapier
rapier3d = { version = "0.31.0", features = ["simd-stable"], optional = true }
bimap = { version = "0.6.3", optional = true }
dashmap = { version = "6.1.0", optional = true }

egui = "0.34"
egui-wgpu = "0.34"
egui-winit = { version = "0.34", default-features = false }

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg", "tga", "bmp", "dds", "farbfeld", "hdr", "ico", "openexr", "pnm", "qoi", "tiff", "webp"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
wgpu = "29.0"
env_logger = "0.11"
pollster = "1.0.1"
ureq = "3.3.0"
arboard = { version = "3.6.1", default-features = false }
ufbx = { version = "0.11.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = "0.7.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
wgpu = { version = "29.0", features = ["webgl"] }
console_error_panic_hook = "0.1.6"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3.103", features = ["Document", "Element", "Window", "Location", "Request", "RequestInit", "RequestMode", "Response"] }
js-sys = "0.3.103"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rfd = "0.17.2"

[[example]]
name = "editor"
required-features = ["editor"]

[[example]]
name = "skeletal_fbx"
required-features = ["skeletal"]

[[example]]
name = "skeletal_gltf"
required-features = ["skeletal"]

[[example]]
name = "skeletal_viewer"
required-features = ["skeletal"]
